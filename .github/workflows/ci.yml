name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy main.py api core services || true

      - name: Pytest
        run: pytest -q

      - name: pip-audit (dependency CVE scan)
        run: |
          pip freeze > /tmp/reqs.txt
          pip-audit -r /tmp/reqs.txt --no-deps || true

  docker:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ecoroute-ai:ci .
